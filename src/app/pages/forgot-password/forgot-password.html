<main class="forgot-password_container">
  <section class="forgot-password_container_header">
    <img src="favicon.svg" alt="Logo" />
    <h2>TripMaker</h2>
  </section>
  <section class="forgot-password_container_formulario">
    <app-dynamic-form
      [fields]="resetPasswordFields"
      [formValidators]="formGroupValidators"
      formTitle="Redefinir Senha"
      submitButtonText="Redefinir"
      (formSubmit)="handleResetPassword($event)"
    >
    </app-dynamic-form>
  </section>
  <section class="forgot-password_container_footer">
    <span>
      Lembrou sua senha?
      <a routerLink="/">Voltar ao Login</a>
    </span>
  </section>
</main>
