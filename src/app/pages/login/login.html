<main class="login_container">
  <section class="login_container_header">
    <img src="favicon.svg" alt="Logo" />
    <h2>TripMaker</h2>
  </section>

  <section class="login_container_formulario">
    
    @if (!isRecovering()) {
      <app-dynamic-form
        [fields]="loginFormFields"
        formTitle="Bem-vindo de volta!"
        submitButtonText="Entrar"
        (formSubmit)="handleLogin($event)"
      > 
      </app-dynamic-form>
      
      <a (click)="toggleMode()" style="cursor: pointer;">Esqueci a minha senha</a>
    } 
    
    @else {
      <app-dynamic-form
        [fields]="recoveryFormFields"
        formTitle="Recuperar Senha"
        submitButtonText="Enviar Link"
        (formSubmit)="handleRecovery($event)"
      >
      </app-dynamic-form>

      <a (click)="toggleMode()" style="cursor: pointer;">Voltar para o Login</a>
    }

  </section>

  <section class="login_container_footer">
    <span>Novo por aqui?
      <a routerLink="/profile">Cadastre-se</a>
    </span>
  </section>
</main>
